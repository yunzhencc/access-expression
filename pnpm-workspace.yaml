catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/ni': ^30.5.0
    bumpp: ^12.2.1
    eslint: ^10.8.1
    nano-staged: ^1.0.2
    publint: ^0.3.23
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.2.1
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.2.0
    vitest: ^4.1.10
  types:
    '@types/node': ^26.2.0
allowBuilds:
  esbuild: true
  simple-git-hooks: true
